name: "SignShop"
main: org.wargamer2010.signshop.SignShop
api-version: "1.21"
version: "${project.version}"
dev-url: https://dev.bukkit.org/projects/signshop
authors: [Wargamer2010, Devinish, Weaves, IndexOutOfMJ, Mart]
softdepend: [Vault, Towny, GriefPrevention, WorldGuard, Essentials, CMI, BentoBox, Residence, LWC, BlockLocker, Ultimate_Economy, LuckPerms, PermissionsEx, Skript, CMIPaperLib, EasyConomy, Lands]
folia-supported: true

commands:
  signshop:
    description: Create and manage chest-based shops
    aliases: [ss]
    usage: /signshop [reload|stats|version|about|help|sign|tutorial|ignore|list|unlink]

permissions:

  # ── Universal override ──────────────────────────────────────────────────────
  SignShop.SuperAdmin:
    description: Grants all SignShop permissions, bypassing OPOverride checks
    default: false

  # ── Standard shop creation (SignShop.Signs.*) ───────────────────────────────
  SignShop.Signs.*:
    description: Allow creation of all non-admin (non-playerIsOp) shop types
    default: true
    children:
      SignShop.Signs.Buy: true
      SignShop.Signs.Sell: true
      SignShop.Signs.Donate: true
      SignShop.Signs.DonateHand: true
      SignShop.Signs.Slot: true
      SignShop.Signs.DeviceOn: true
      SignShop.Signs.DeviceOff: true
      SignShop.Signs.Toggle: true
      SignShop.Signs.Device: true
      SignShop.Signs.Dispose: true
      SignShop.Signs.DeviceItem: true
      SignShop.Signs.Trade: true
      SignShop.Signs.Share: true
      SignShop.Signs.Restricted: true
      SignShop.Signs.Bank: true
      SignShop.Signs.Jukebox: true

  SignShop.Signs.Buy:
    description: Allow creation of [Buy] shops
    default: true
  SignShop.Signs.Sell:
    description: Allow creation of [Sell] shops
    default: true
  SignShop.Signs.Donate:
    description: Allow creation of [Donate] shops
    default: true
  SignShop.Signs.DonateHand:
    description: Allow creation of [DonateHand] shops
    default: true
  SignShop.Signs.Slot:
    description: Allow creation of [Slot] shops
    default: true
  SignShop.Signs.DeviceOn:
    description: Allow creation of [DeviceOn] shops
    default: true
  SignShop.Signs.DeviceOff:
    description: Allow creation of [DeviceOff] shops
    default: true
  SignShop.Signs.Toggle:
    description: Allow creation of [Toggle] shops
    default: true
  SignShop.Signs.Device:
    description: Allow creation of [Device] shops
    default: true
  SignShop.Signs.Dispose:
    description: Allow creation of [Dispose] shops
    default: true
  SignShop.Signs.DeviceItem:
    description: Allow creation of [DeviceItem] shops
    default: true
  SignShop.Signs.Trade:
    description: Allow creation of [Trade] shops
    default: true
  SignShop.Signs.Share:
    description: Allow creation of [Share] shops
    default: true
  SignShop.Signs.Restricted:
    description: Allow creation of [Restricted] shops
    default: true
  SignShop.Signs.Bank:
    description: Allow creation of [Bank] shops
    default: true
  SignShop.Signs.Jukebox:
    description: Allow creation of [Jukebox] shops
    default: true

  # ── Admin shop creation (SignShop.Admin.*) ──────────────────────────────────
  SignShop.Admin.*:
    description: Allow creation of all admin (playerIsOp) shop types
    default: op
    children:
      SignShop.Admin.iSell: true
      SignShop.Admin.iBuy: true
      SignShop.Admin.gBuy: true
      SignShop.Admin.gSell: true
      SignShop.Admin.Day: true
      SignShop.Admin.Night: true
      SignShop.Admin.Rain: true
      SignShop.Admin.ClearSkies: true
      SignShop.Admin.Heal: true
      SignShop.Admin.Repair: true
      SignShop.Admin.iSlot: true
      SignShop.Admin.Enchant: true
      SignShop.Admin.iBuyXP: true
      SignShop.Admin.iSellXP: true
      SignShop.Admin.iTrade: true
      SignShop.Admin.TpToOwner: true
      SignShop.Admin.Class: true
      SignShop.Admin.Disenchant: true
      SignShop.Admin.Command: true
      SignShop.Admin.UserCommand: true
      SignShop.Admin.Kit: true
      SignShop.Admin.ResetKit: true
      SignShop.Admin.iXPBuy: true
      SignShop.Admin.iXPSell: true
      SignShop.Admin.Promote: true
      SignShop.Admin.TCommand: true

  SignShop.Admin.iSell:
    description: Allow creation of [iSell] shops (infinite sell, no chest needed)
    default: op
  SignShop.Admin.iBuy:
    description: Allow creation of [iBuy] shops (infinite buy, no chest needed)
    default: op
  SignShop.Admin.gBuy:
    description: Allow creation of [gBuy] ghost buy shops (no money deposited to owner)
    default: op
  SignShop.Admin.gSell:
    description: Allow creation of [gSell] ghost sell shops (no money withdrawn from owner)
    default: op
  SignShop.Admin.Day:
    description: Allow creation of [Day] shops (set world time to day)
    default: op
  SignShop.Admin.Night:
    description: Allow creation of [Night] shops (set world time to night)
    default: op
  SignShop.Admin.Rain:
    description: Allow creation of [Rain] shops (set weather to rain)
    default: op
  SignShop.Admin.ClearSkies:
    description: Allow creation of [ClearSkies] shops (set weather to clear)
    default: op
  SignShop.Admin.Heal:
    description: Allow creation of [Heal] shops
    default: op
  SignShop.Admin.Repair:
    description: Allow creation of [Repair] shops
    default: op
  SignShop.Admin.iSlot:
    description: Allow creation of [iSlot] shops (infinite slot machine)
    default: op
  SignShop.Admin.Enchant:
    description: Allow creation of [Enchant] shops
    default: op
  SignShop.Admin.iBuyXP:
    description: Allow creation of [iBuyXP] shops (sell XP levels to players)
    default: op
  SignShop.Admin.iSellXP:
    description: Allow creation of [iSellXP] shops (buy XP levels from players)
    default: op
  SignShop.Admin.iTrade:
    description: Allow creation of [iTrade] shops (infinite item trade, no chest needed)
    default: op
  SignShop.Admin.TpToOwner:
    description: Allow creation of [TpToOwner] shops (teleport customer to owner)
    default: op
  SignShop.Admin.Class:
    description: Allow creation of [Class] shops (replace player inventory with chest contents)
    default: op
  SignShop.Admin.Disenchant:
    description: Allow creation of [Disenchant] shops
    default: op
  SignShop.Admin.Command:
    description: Allow creation of [Command] shops (run server command as console)
    default: op
  SignShop.Admin.UserCommand:
    description: Allow creation of [UserCommand] shops (run command as the customer)
    default: op
  SignShop.Admin.Kit:
    description: Allow creation of [Kit] shops (one-time item kit)
    default: op
  SignShop.Admin.ResetKit:
    description: Allow creation of [ResetKit] shops (reset one-time shop usage)
    default: op
  SignShop.Admin.iXPBuy:
    description: Allow creation of [iXPBuy] shops (trade XP for items)
    default: op
  SignShop.Admin.iXPSell:
    description: Allow creation of [iXPSell] shops (trade items for XP)
    default: op
  SignShop.Admin.Promote:
    description: Allow creation of [Promote] shops (promote player to a permission group)
    default: op
  SignShop.Admin.TCommand:
    description: Allow creation of [TCommand] shops (run timed command)
    default: op

