    default: false

  # ── Bypass shop plot restrictions (SignShop.BypassShopPlots.*) ──────────────
  SignShop.BypassShopPlots.*:
    description: Bypass shop plot restrictions from all supported protection plugins
    default: op
    children:
      SignShop.BypassShopPlots.Towny: true
      SignShop.BypassShopPlots.WorldGuard: true

  SignShop.BypassShopPlots.Towny:
    description: Bypass Towny shop plot restrictions when EnableShopPlotSupport is true
    default: op
  SignShop.BypassShopPlots.WorldGuard:
    description: Bypass WorldGuard allow-shop flag restrictions when EnableShopPlotSupport is true
    default: op

  # ── Shop management ──────────────────────────────────────────────────────────
  SignShop.ChangeOwner:
    description: Transfer ownership of your own shops to another player
    default: op
  SignShop.ChangeOwner.Others:
    description: Transfer ownership of any shop (including those you do not own)
    default: op
  SignShop.CopyPaste:
    description: Copy your own shop configuration to paste onto a new sign
    default: op
  SignShop.CopyPaste.Others:
    description: Copy any shop's configuration regardless of ownership
    default: op
  SignShop.Destroy.Others:
    description: Destroy shops owned by other players when EnableShopOwnerProtection is true
    default: op

  # ── Shop inspection and dyeing ───────────────────────────────────────────────
  SignShop.Inspect.Own:
    description: Inspect shops you own (right-click sign with InspectMaterial)
    default: true
  SignShop.Inspect.Others:
    description: Inspect any shop regardless of ownership
    default: op
  SignShop.Dye.Own:
    description: Change the color of signs on shops you own
    default: true
  SignShop.Dye.Others:
    description: Change the color of any sign regardless of ownership
    default: op

  # ── Miscellaneous ────────────────────────────────────────────────────────────
  SignShop.ignoremax:
    description: Bypass the MaxShopsPerPerson and group shop limits
    default: op
  SignShop.ignorerepair:
    description: Repair enchanted items at [Repair] shops even when AllowEnchantedRepair is false
    default: false
  SignShop.Permit:
    description: Create shops with any item type when EnablePermits is true (bypasses per-material check)
    default: false

  # ── Multi-currency shop creation (SignShop.Currency.Create.*) ───────────────
  # Children here match the non-default currencies in the default config.yml.
  # If you add custom currencies, grant SignShop.Currency.Create.<name> directly.
  SignShop.Currency.Create.*:
    description: Create shops using any configured non-default currency (requires VaultUnlocked)
    default: op
    children:
      SignShop.Currency.Create.gold: true
      SignShop.Currency.Create.emeralds: true
      SignShop.Currency.Create.tokens: true

  SignShop.Currency.Create.gold:
    description: Create shops priced in gold (requires VaultUnlocked)
    default: op
  SignShop.Currency.Create.emeralds:
    description: Create shops priced in emeralds (requires VaultUnlocked)
    default: op
  SignShop.Currency.Create.tokens:
    description: Create shops priced in tokens (requires VaultUnlocked)
    default: op
