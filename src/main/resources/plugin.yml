  # ── Deny block linking (SignShop.DenyLink.*) ────────────────────────────────
  SignShop.DenyLink.*:
    description: Deny linking all block types to shops (alias-based, see linkableMaterials in config)
    default: false
    children:
      SignShop.DenyLink.chest: true
      SignShop.DenyLink.dropper: true
      SignShop.DenyLink.hopper: true
      SignShop.DenyLink.anvil: true
      SignShop.DenyLink.dispenser: true
      SignShop.DenyLink.furnace: true
