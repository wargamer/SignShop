      SignShop.AllowLink.slab: true
      SignShop.AllowLink.jukebox: true
      SignShop.AllowLink.door: true
      SignShop.AllowLink.button: true

  SignShop.AllowLink.chest:
    description: Override DenyLink.chest — allow linking chests even when DenyLink.chest is set
    default: false
  SignShop.AllowLink.dropper:
    description: Override DenyLink.dropper — allow linking droppers even when DenyLink.dropper is set
